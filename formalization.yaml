        statement-side definitions are verbatim copies of RequestProject/Defs.lean
        and are checked definitionally equal to them in verification/Audit.lean.
    - source: "Counting form stated after Theorem 1: N_N(E) > E|Ω|/(4π) for all E > 0"
      lean: "PalomarPolyaNeumann.strict_neumann_polya_count"
      module: "Challenge"
      status: "proved"
      note: >-
        Proved in Solution.lean by PolyaNeumann.strict_neumann_polya_count

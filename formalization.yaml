version: "v0.4"

project:
  name: "Strict Neumann Polya inequality on simply connected planar domains"
  description: >-
    A Lean 4 / Mathlib formalization of the strict Neumann Pólya inequality for
    bounded simply connected Lipschitz domains in the plane. The plane is
    identified with ℂ; the Neumann eigenvalues μ_0 ≤ μ_1 ≤ ... are defined by
    the Courant–Fischer min–max formula for the form ∫|∇u|² on H¹(Ω) (weak
    gradients in L²), indexed from 0 and repeated according to multiplicity,
    and N_N(E) = #{j ≥ 0 : μ_j < E}. The principal results are: for every
    bounded simply connected Lipschitz domain Ω and every integer j ≥ 1,
    |Ω| μ_j(Ω) < 4πj; and, equivalently, N_N(E) > |Ω| E / (4π) for every E > 0.
    The proof development (about 100,000 lines, namespace PolyaNeumann) also
    identifies the variational eigenvalues with the spectrum of the constructed
    self-adjoint Neumann operator, proves a quantitative smooth-domain estimate
    via boundary transport, Cayley/monodromy rank bounds and a Herglotz-wave
    reduction, and passes to Lipschitz domains by smooth approximation.
  authors:
    - "Quanyu Tang"
    - "Zuoqin Wang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Quanyu Tang"
    - "Zuoqin Wang"


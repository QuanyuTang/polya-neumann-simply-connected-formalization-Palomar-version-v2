fidelity:
  divergences: >-
    None known for the stated theorem. Formalization conventions: ℝ² is
    identified with ℂ; area is Lebesgue measure as an extended nonnegative real
    (volume Ω : ℝ≥0∞); eigenvalues take values in ℝ≥0∞ and are defined by the
    min–max formula over (j+1)-dimensional subspaces of L²(Ω) (subspaces not
    contained in H¹(Ω) contribute ⊤), which for a bounded Lipschitz domain
    coincides with the Neumann spectrum (formally proved as
    PolyaNeumann.neumannEigenvalue_eq_spectral). The counting function is an
    extended natural number. The paper's hypothesis "bounded simply connected
    Lipschitz domain" is expressed by Bornology.IsBounded Ω, IsLipschitzDomain Ω
    (which includes open and connected) and SimplyConnectedSpace Ω.


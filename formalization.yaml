status:
  scope: >-
    Formalized and proved without sorry: (1) PolyaNeumann.strict_neumann_polya
    (alias `main`): for every bounded, simply connected Lipschitz domain Ω ⊆ ℂ
    and every natural number j ≥ 1, volume Ω * neumannEigenvalue Ω j <
    ENNReal.ofReal (4 * π * j); (2) PolyaNeumann.strict_neumann_polya_count
    (alias `main_counting`): for every such Ω and every real E > 0,
    volume Ω * ENNReal.ofReal E / ENNReal.ofReal (4 * π) <
    neumannCount Ω (ENNReal.ofReal E). Lipschitz domains are defined by local
    rigid-motion graph charts with Lipschitz graph functions; the Neumann
    eigenvalues are the variational (min–max) eigenvalues of the H¹ energy form,
    counted with multiplicity and indexed from μ_0 = 0. The Palomar Challenge
    restates exactly these two theorems, with verbatim copies of the
    definitions, in the namespace PalomarPolyaNeumann. Not part of the claims:
    seven experimental modules of the RequestProject directory that are not
    imported by RequestProject.Main, Solution, or any other module
    (ConformalConormalGeometry, ConformalH1Pullback, FourierCoefficientGain,
    HerglotzKernelForm, LocalConformalObservationKernel,
    NeumannFractionalResolvent, PhysicalCauchyJump); they do not build with
    Lean/Mathlib v4.35.0-rc2 and are outside the audited theorem path.
  # Counts refer to the proof development (RequestProject.Main closure and
  # Solution.lean), excluding Challenge.lean's two deliberate statement sorries.
  sorry_count: 0
  sorry_in_definitions: 0
  # The only axioms used are Lean's standard propext, Classical.choice and
  # Quot.sound; the project declares no axioms of its own.
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "PolyaNeumann.strict_neumann_polya"
      file: "RequestProject/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PolyaNeumann.strict_neumann_polya_count"
      file: "RequestProject/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

